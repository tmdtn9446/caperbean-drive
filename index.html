<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>CAPERBEAN DRIVE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }
header { background:#111; color:#fff; padding:20px; }
.container { max-width:900px; margin:auto; padding:20px; }

.card { background:#fff; padding:15px; margin-bottom:15px; border-radius:10px; }

input, button, select {
  padding:10px;
  margin:5px 0;
  width:100%;
}

button {
  background:#111;
  color:#fff;
  border:none;
  cursor:pointer;
}

#dropZone {
  border:2px dashed #999;
  padding:20px;
  text-align:center;
  margin-bottom:10px;
  background:white;
}

#fileList {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  padding:0;
  list-style:none;
}

.fileCard {
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.fileCard img {
  max-width:100%;
  border-radius:6px;
  margin-top:5px;
}

.deleteBtn {
  margin-top:8px;
  background:red;
}
</style>
</head>

<body>

<header>
<h1>CAPERBEAN DRIVE</h1>
<p>Team Archive System</p>
</header>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginBox">
<h2>Login</h2>

<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">

<button onclick="login()">Login</button>
<button onclick="signup()">Sign Up</button>
</div>

<!-- APP -->
<div class="card" id="appBox" style="display:none;">

<h2>Add Project</h2>
<input id="newProjectName" placeholder="새 프로젝트 이름">
<button onclick="addProject()">Create Project</button>

<h2>Projects</h2>
<select id="projectSelect" onchange="loadFiles()"></select>

<h2>Upload</h2>

<div id="dropZone">파일을 드래그해서 업로드</div>

<input type="file" id="fileInput">
<button onclick="uploadFile()">Upload</button>

<h2>Search</h2>
<input id="searchInput" placeholder="파일 검색..." oninput="loadFiles()">

<h2>Files</h2>
<div id="fileList"></div>

</div>

</div>

<script>
const SUPABASE_URL = "https://otzbtdgiawgvekpnnlgn.supabase.co";
const SUPABASE_KEY = "sb_publishable_T8VXv9906iImhpTGUcCDJQ_Stu4axAw";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

/* SESSION */
window.addEventListener("load", async () => {
  const { data } = await client.auth.getSession();

  if(data.session){
    currentUser = data.session.user;
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("appBox").style.display = "block";
    loadProjects();
  }
});

/* LOGIN */
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert("로그인 실패");
    return;
  }

  currentUser = data.user;

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("appBox").style.display = "block";

  loadProjects();
}

/* SIGNUP */
async function signup(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await client.auth.signUp({
    email,
    password
  });

  if(error){
    alert("회원가입 실패");
    return;
  }

  alert("회원가입 성공!");
}

/* PROJECT */
async function addProject(){
  const name = document.getElementById("newProjectName").value;

  if(!name){
    alert("이름 입력!");
    return;
  }

  await client.from("projects").insert([{ name }]);

  document.getElementById("newProjectName").value = "";
  loadProjects();
}

async function loadProjects(){
  const { data } = await client.from("projects").select("*");

  const select = document.getElementById("projectSelect");
  select.innerHTML = "";

  data.forEach(p=>{
    const opt = document.createElement("option");
    opt.value = p.name;
    opt.textContent = p.name;
    select.appendChild(opt);
  });

  loadFiles();
}

/* UPLOAD CORE */
async function handleUpload(file){
  const project = document.getElementById("projectSelect").value;

  if(!file || !project){
    alert("프로젝트 선택 필요");
    return;
  }

  const { data, error } = await client.storage
    .from("caperbean-files")
    .upload(`${project}/${file.name}`, file);

  if(error){
    alert("업로드 실패");
    return;
  }

  await client.from("files").insert({
    name: file.name,
    url: data.path,
    project: project
  });

  loadFiles();
}

/* BUTTON UPLOAD */
function uploadFile(){
  const file = document.getElementById("fileInput").files[0];
  handleUpload(file);
}

/* LOAD FILES */
async function loadFiles(){
  const project = document.getElementById("projectSelect").value;
  const search = document.getElementById("searchInput").value?.toLowerCase() || "";

  if(!project) return;

  const { data } = await client
    .from("files")
    .select("*")
    .eq("project", project);

  const filtered = data.filter(f =>
    f.name.toLowerCase().includes(search)
  );

  const list = document.getElementById("fileList");
  list.innerHTML = "";

  filtered.forEach(f=>{
    const div = document.createElement("div");
    div.className = "fileCard";

    div.innerHTML = `
      <strong>${f.name}</strong>
      <img src="https://otzbtdgiawgvekpnnlgn.supabase.co/storage/v1/object/public/caperbean-files/${f.url}" />
      <button class="deleteBtn" onclick="deleteFile('${f.id}', '${f.url}')">삭제</button>
    `;

    list.appendChild(div);
  });
}

/* DELETE */
async function deleteFile(id, path){
  await client.from("files").delete().eq("id", id);

  await client.storage
    .from("caperbean-files")
    .remove([path]);

  loadFiles();
}

/* DRAG & DROP */
const dropZone = document.getElementById("dropZone");

dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.style.background = "#eee";
});

dropZone.addEventListener("dragleave", () => {
  dropZone.style.background = "white";
});

dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.style.background = "white";

  const file = e.dataTransfer.files[0];
  handleUpload(file);
});
</script>

</body>
</html>
