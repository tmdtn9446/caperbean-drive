<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>CAPERBEAN DRIVE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }
header { background:#111; color:#fff; padding:20px; }
.container { max-width:900px; margin:auto; padding:20px; }
.card { background:#fff; padding:15px; margin-bottom:15px; border-radius:10px; }
input, button, select { padding:10px; margin:5px 0; width:100%; }
button { background:#111; color:#fff; border:none; cursor:pointer; }
</style>
</head>

<body>

<header>
<h1>CAPERBEAN DRIVE</h1>
<p>Team Archive System</p>
</header>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginBox">
<h2>Login</h2>

<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">

<button onclick="login()">Login</button>
<button onclick="signup()">Sign Up</button>
</div>

<!-- APP -->
<div class="card" id="appBox" style="display:none;">

<h2>Project</h2>
<select id="projectSelect"></select>

<h2>File Upload</h2>
<input type="file" id="fileInput">
<button onclick="uploadFile()">Upload</button>

<h3>Files</h3>
<ul id="fileList"></ul>

</div>

</div>

<script>
const SUPABASE_URL = "https://otzbtdgiawgvekpnnlgn.supabase.co";
const SUPABASE_KEY = "sb_publishable_T8VXv9906iImhpTGUcCDJQ_Stu4axAw";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// LOGIN
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert("로그인 실패");
    return;
  }

  document.getElementById("loginBox").style.display="none";
  document.getElementById("appBox").style.display="block";

  loadProjects();
  loadFiles();
}

// SIGNUP
async function signup(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await client.auth.signUp({
    email,
    password
  });

  if(error){
    alert("회원가입 실패");
    return;
  }

  alert("회원가입 성공! 로그인 해줘");
}

// LOAD PROJECTS
async function loadProjects(){
  const { data } = await client.from("projects").select("*");

  const select = document.getElementById("projectSelect");
  select.innerHTML = "";

  data.forEach(p=>{
    const opt = document.createElement("option");
    opt.value = p.name;
    opt.textContent = p.name;
    select.appendChild(opt);
  });
}

// UPLOAD
async function uploadFile(){
  const file = document.getElementById("fileInput").files[0];
  const project = document.getElementById("projectSelect").value;

  const { data, error } = await client.storage
    .from("caperbean-files")
    .upload(`${project}/${file.name}`, file);

  if(error){
    alert("업로드 실패");
    return;
  }

  await client.from("files").insert({
    name: file.name,
    url: data.path,
    project: project
  });

  loadFiles();
}

// LOAD FILES
async function loadFiles(){
  const project = document.getElementById("projectSelect").value;

  const { data } = await client
    .from("files")
    .select("*")
    .eq("project", project);

  const list = document.getElementById("fileList");
  list.innerHTML = "";

  data.forEach(f=>{
    const li = document.createElement("li");
    li.innerText = f.name;
    list.appendChild(li);
  });
}
</script>

</body>
</html>
