<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>CAPERBEAN DRIVE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { margin:0; font-family:Arial; background:#f4f4f4; }
header { background:#111; color:#fff; padding:20px; }

.container { max-width:1100px; margin:auto; padding:20px; }

.card { background:#fff; padding:15px; border-radius:10px; margin-bottom:15px; }

input, button, select {
  width:100%;
  padding:10px;
  margin:5px 0;
}

button {
  background:#111;
  color:#fff;
  border:none;
  cursor:pointer;
}

.layout {
  display:flex;
  gap:10px;
}

.sidebar {
  width:250px;
  background:#fff;
  padding:10px;
  border-radius:10px;
  height:80vh;
  overflow:auto;
}

.main {
  flex:1;
}

.folder {
  cursor:pointer;
  padding:5px;
}

.folder:hover {
  background:#eee;
}

#fileList {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:10px;
}

.fileCard {
  background:#fff;
  padding:10px;
  border-radius:10px;
}

.fileCard img, video {
  width:100%;
  border-radius:6px;
}

.smallBtn {
  margin-top:5px;
  font-size:12px;
}
</style>
</head>

<body>

<header>
<h1>CAPERBEAN DRIVE</h1>
</header>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginBox">
<h2>Login</h2>
<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">
<button onclick="login()">Login</button>
<button onclick="signup()">Sign Up</button>
</div>

<!-- APP -->
<div class="layout" id="appBox" style="display:none;">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>📁 Folders</h3>
<div id="folderTree"></div>

<button onclick="createFolder()">+ Folder</button>
<button onclick="goBack()">⬅ Back</button>
</div>

<!-- MAIN -->
<div class="main">

<h3>Upload</h3>
<input type="file" id="fileInput">
<button onclick="uploadFile()">Upload</button>

<h3>Search</h3>
<input id="searchInput" oninput="loadFiles()" placeholder="검색">

<h3>Sort</h3>
<select id="sortSelect" onchange="loadFiles()">
  <option value="new">최신순</option>
  <option value="old">오래된순</option>
</select>

<div id="fileList"></div>

</div>

</div>

</div>

<!-- MODAL -->
<div id="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;">
<img id="modalImg" style="max-width:80%;max-height:80%;">
</div>

<script>
const client = supabase.createClient(
  "https://otzbtdgiawgvekpnnlgn.supabase.co",
  "sb_publishable_T8VXv9906iImhpTGUcCDJQ_Stu4axAw"
);

let currentUser = null;
let currentFolder = null;
let stack = [];

/* SESSION */
window.onload = async () => {
  const { data } = await client.auth.getSession();
  if(data.session){
    currentUser = data.session.user;
    document.getElementById("loginBox").style.display="none";
    document.getElementById("appBox").style.display="flex";
    loadFolders();
    loadFiles();
  }
};

/* LOGIN */
async function login(){
  const { data, error } = await client.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });

  if(error) return alert("로그인 실패");

  currentUser = data.user;
  loginBox.style.display="none";
  appBox.style.display="flex";

  loadFolders();
}

/* SIGNUP (5명 제한) */
async function signup(){
  const { data: users } = await client.from("team").select("*");

  if(users.length >= 5){
    return alert("팀 최대 5명");
  }

  const { error } = await client.auth.signUp({
    email:email.value,
    password:password.value
  });

  if(error) return alert("실패");

  alert("가입 성공");
}

/* FOLDER */
async function loadFolders(parent=null){
  const { data } = await client
    .from("projects")
    .select("*")
    .eq("parent_id", parent);

  const tree = document.getElementById("folderTree");
  tree.innerHTML = "";

  data.forEach(f=>{
    const div = document.createElement("div");
    div.className="folder";
    div.innerHTML = "📁 "+f.name;
    div.onclick = () => openFolder(f.id);
    tree.appendChild(div);
  });
}

function openFolder(id){
  stack.push(currentFolder);
  currentFolder = id;
  loadFolders(id);
  loadFiles();
}

function goBack(){
  currentFolder = stack.pop() || null;
  loadFolders(currentFolder);
  loadFiles();
}

async function createFolder(){
  const name = prompt("폴더 이름");
  if(!name) return;

  await client.from("projects").insert({
    name,
    parent_id: currentFolder,
    owner_id: currentUser.id
  });

  loadFolders(currentFolder);
}

/* FILE UPLOAD */
async function uploadFile(){
  const file = fileInput.files[0];
  if(!file) return;

  const { data } = await client.storage
    .from("caperbean-files")
    .upload(`${currentFolder || "root"}/${file.name}`, file);

  await client.from("files").insert({
    name:file.name,
    url:data.path,
    project_id:currentFolder,
    created_at:new Date()
  });

  loadFiles();
}

/* FILE LOAD */
async function loadFiles(){
  let { data } = await client
    .from("files")
    .select("*")
    .eq("project_id", currentFolder);

  const search = searchInput.value?.toLowerCase() || "";
  const sort = sortSelect.value;

  data = data.filter(f=>f.name.toLowerCase().includes(search));

  data.sort((a,b)=>{
    return sort==="new"
    ? new Date(b.created_at)-new Date(a.created_at)
    : new Date(a.created_at)-new Date(b.created_at);
  });

  fileList.innerHTML="";

  data.forEach(f=>{
    const url = `https://otzbtdgiawgvekpnnlgn.supabase.co/storage/v1/object/public/caperbean-files/${f.url}`;

    const isVideo = f.name.match(/\.(mp4|mov|webm)$/);

    const div = document.createElement("div");
    div.className="fileCard";

    div.innerHTML = `
      <strong>${f.name}</strong>
      ${
        isVideo
        ? `<video src="${url}" controls></video>`
        : `<img src="${url}" onclick="openModal('${url}')">`
      }
      <button class="smallBtn" onclick="downloadFile('${url}')">⬇</button>
    `;

    fileList.appendChild(div);
  });
}

/* DOWNLOAD */
function downloadFile(url){
  const a = document.createElement("a");
  a.href=url;
  a.download="";
  a.click();
}

/* MODAL */
function openModal(src){
  modal.style.display="flex";
  modalImg.src=src;
}

modal.onclick = ()=> modal.style.display="none";
</script>

</body>
</html>
